name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://basedrive:basedrive@localhost:5432/basedrive
  DB_DRIVER: pg
  AUTH_SECRET: ci-only-secret-not-used-anywhere-else
  AUTH_TRUST_HOST: "true"
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_BUCKET: basedrive
  S3_ACCESS_KEY_ID: basedrive
  S3_SECRET_ACCESS_KEY: basedrive-secret
  S3_FORCE_PATH_STYLE: "true"
  APP_URL: http://localhost:3100
  CRON_SECRET: ci-cron
  E2E_PORT: "3100"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: basedrive
          POSTGRES_PASSWORD: basedrive
          POSTGRES_DB: basedrive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U basedrive" --health-interval 3s --health-timeout 3s --health-retries 20
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: basedrive
          MINIO_ROOT_PASSWORD: basedrive-secret
          MINIO_DEFAULT_BUCKETS: basedrive
          MINIO_API_CORS_ALLOW_ORIGIN: "*"
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/minio/health/live" --health-interval 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm build:worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Oracle Always Free is ARM64, so build both.
      - uses: docker/build-push-action@v6
        with:
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/basedrive:latest
            ghcr.io/${{ github.repository_owner }}/basedrive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          target: migrate
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/basedrive-migrate:latest
            ghcr.io/${{ github.repository_owner }}/basedrive-migrate:${{ github.sha }}
          cache-from: type=gha
