apiVersion: v1
kind: ConfigMap
metadata:
  name: basedrive-config
data:
  DB_DRIVER: pg
  S3_ENDPOINT: http://minio:9000
  S3_REGION: auto
  S3_BUCKET: basedrive
  S3_FORCE_PATH_STYLE: "true"
  APP_URL: https://basedrive.localhost
  AUTH_TRUST_HOST: "true"
  MAX_FILE_BYTES: "104857600"
  GLOBAL_STORAGE_CAP_BYTES: "8589934592"
---
# Real values come from `kubectl create secret` or the overlay's secretGenerator.
# Never commit actual secrets.
apiVersion: v1
kind: Secret
metadata:
  name: basedrive-secrets
type: Opaque
stringData:
  DATABASE_URL: postgres://basedrive:change-me@postgres:5432/basedrive
  POSTGRES_PASSWORD: change-me
  AUTH_SECRET: change-me
  S3_ACCESS_KEY_ID: basedrive
  S3_SECRET_ACCESS_KEY: change-me-too
  CRON_SECRET: change-me
  RESEND_API_KEY: ""
  AUTH_GITHUB_ID: ""
  AUTH_GITHUB_SECRET: ""
