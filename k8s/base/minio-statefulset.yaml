apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          # MinIO no longer publishes community images to Docker Hub/quay.
          image: bitnamilegacy/minio:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: basedrive-secrets, key: S3_ACCESS_KEY_ID } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: basedrive-secrets, key: S3_SECRET_ACCESS_KEY } }
            - { name: MINIO_DEFAULT_BUCKETS, value: basedrive }
            # Browsers PUT parts straight to MinIO; it exposes ETag by default and
            # expires stale multipart uploads after 24h (api stale_uploads_expiry).
            - { name: MINIO_API_CORS_ALLOW_ORIGIN, value: "*" }
          ports:
            - containerPort: 9000
            - containerPort: 9001
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /bitnami/minio/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
