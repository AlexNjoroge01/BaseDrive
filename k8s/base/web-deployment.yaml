apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # drizzle-kit migrate; idempotent, so every rollout can run it.
        - name: migrate
          image: ghcr.io/alexnjoroge01/basedrive-migrate:latest
          envFrom:
            - secretRef: { name: basedrive-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      containers:
        - name: web
          image: ghcr.io/alexnjoroge01/basedrive:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: basedrive-config }
            - secretRef: { name: basedrive-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { memory: 768Mi }
