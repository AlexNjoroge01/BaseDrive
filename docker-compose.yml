name: basedrive

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: basedrive
      POSTGRES_PASSWORD: basedrive
      POSTGRES_DB: basedrive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basedrive"]
      interval: 3s
      timeout: 3s
      retries: 20

  # MinIO stopped publishing community images to Docker Hub/quay in 2025;
  # Bitnami's legacy build is the same server and creates the bucket for us.
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: basedrive
      MINIO_ROOT_PASSWORD: basedrive-secret
      MINIO_DEFAULT_BUCKETS: basedrive
      # Browser PUTs parts directly to MinIO, so the app origin must be allowed.
      # MinIO exposes ETag over CORS by default and expires stale multipart
      # uploads after 24h on its own; on R2 configure both in the dashboard.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
